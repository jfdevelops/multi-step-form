name: CI

on:
  workflow_call:

jobs:
  core:
    name: Core Build & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Typecheck Core before building so declaration generation is not the only type gate.
    - name: Typecheck (core)
      run: pnpm --filter=@jfdevelops/multi-step-form-core typecheck

    # 2. UPDATED: Output to XML
    # We pass --reporter=junit and --outputFile via CLI to keep it clean
    - name: Run tests (core)
      env:
        CI: true
        GITHUB_ACTIONS: true
      run: pnpm run test:core --reporter=junit --outputFile=test-results.xml

    # 3. ADDED: Upload Report
    - name: Report Core Results
      uses: dorny/test-reporter@v1
      if: (success() || failure()) && hashFiles('packages/core/test-results.xml') != ''
      with:
        name: Core Tests
        working-directory: packages/core
        path: test-results.xml
        reporter: java-junit

    - name: Build (core)
      run: pnpm run build:core

    - name: Upload Core Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: core-build
        path: packages/core/dist
        retention-days: 1

  # ------------------------------------------------------------------
  # JOB 2: React (Downloads Core, then Runs)
  # ------------------------------------------------------------------
  react:
    name: React Build & Test
    runs-on: ubuntu-latest
    needs: core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Core Artifacts
        uses: actions/download-artifact@v4
        with:
          name: core-build
          path: packages/core/dist

      # React resolves Core through its package exports, so its typecheck runs after the
      # Core declaration artifact has been restored.
      - name: Typecheck (react)
        run: pnpm --filter=@jfdevelops/react-multi-step-form typecheck

      # 2. UPDATED: Output to XML for React tests as well
      - name: Run tests (react)
        working-directory: packages/react
        env:
          CI: true
          GITHUB_ACTIONS: true
        # Changed reporters to include junit and output file
        run: pnpm test --browser.headless=true --reporter=default --reporter=junit --outputFile=test-results.xml

      # 3. ADDED: Upload Report
      - name: Report React Results
        uses: dorny/test-reporter@v1
        if: (success() || failure()) && hashFiles('packages/react/test-results.xml') != ''
        with:
          name: React Tests
          working-directory: packages/react
          path: test-results.xml
          reporter: java-junit

      - name: Build (react)
        run: pnpm run build:react

      # Compile a real consumer after both packages exist to catch public API and
      # declaration regressions that package-internal tests cannot expose.
      - name: Build example
        run: pnpm --filter=react-basic build

  # ------------------------------------------------------------------
  # JOB 3: Form builder packages (Downloads Core, then Runs)
  # ------------------------------------------------------------------
  builder:
    name: Builder Build & Test
    runs-on: ubuntu-latest
    needs: core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Core Artifacts
        uses: actions/download-artifact@v4
        with:
          name: core-build
          path: packages/core/dist

      # The adapters and React bindings resolve builder-core through its package exports,
      # so builder-core is typechecked, tested and built first.
      - name: Typecheck, test & build (builder-core)
        env:
          CI: true
        run: |
          pnpm --filter=@jfdevelops/multi-step-form-builder-core typecheck
          pnpm --filter=@jfdevelops/multi-step-form-builder-core test
          pnpm --filter=@jfdevelops/multi-step-form-builder-core build

      # One package per Standard Schema library: zod, valibot, arktype, effect, yup, joi.
      - name: Typecheck, test & build (validator adapters)
        env:
          CI: true
        run: |
          ADAPTERS='--filter=./packages/builder-* --filter=!@jfdevelops/multi-step-form-builder-core --filter=!@jfdevelops/react-multi-step-form-builder'
          pnpm $ADAPTERS typecheck
          pnpm $ADAPTERS test
          pnpm $ADAPTERS build

      - name: Typecheck, test & build (builder-react)
        env:
          CI: true
        run: |
          pnpm --filter=@jfdevelops/react-multi-step-form-builder typecheck
          pnpm --filter=@jfdevelops/react-multi-step-form-builder test
          pnpm --filter=@jfdevelops/react-multi-step-form-builder build

      # The example checks that generated code typechecks with every library, and walks the UI.
      # Generated code imports the React bindings, so their declarations must be built.
      - name: Test & build (form builder example)
        env:
          CI: true
        run: |
          pnpm --filter=@jfdevelops/react-multi-step-form build
          pnpm --filter=react-form-builder test
          pnpm --filter=react-form-builder build
